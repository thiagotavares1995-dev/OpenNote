[package]
name = "on-cli"
version.workspace = true
edition.workspace = true
# Bevy 0.19 and egui need 1.95; the engine crates keep the workspace minimum.
rust-version = "1.95"
license.workspace = true
description = "Works out piano fingerings, writes them onto the score, and plays them with 3D hands."

[[bin]]
name = "opennote"
path = "src/main.rs"

[dependencies]
mimalloc = "0.1"
on-hand.workspace = true
on-score.workspace = true
on-fingering.workspace = true
on-train.workspace = true
on-engrave.workspace = true
on-viz = { workspace = true, features = ["render"] }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
tracing-subscriber.workspace = true

[features]
perfil = ["on-viz/perfil"]

[lints]
workspace = true
